name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Byte-compile all Python sources
        run: python -m compileall -q .
